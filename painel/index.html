
<!Doctype html>
<html lang="en" dir="ltr">
	<head>
	    <meta charset="UTF-8">
		<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=0'>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="description" content="Vidrama - Painel de Gerenciamento">
		<meta name="author" content="Design GIL">
		<link rel="shortcut icon" type="image/x-icon" href="assets/images/brand/favicon.ico" />
		<title>Login</title>
		<link href="painel/assets/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
		<link href="painel/assets/css/style.css" rel="stylesheet"/>
		<link href="painel/assets/css/skin-modes.css" rel="stylesheet"/>
		<link href="painel/assets/plugins/single-page/css/main.css" rel="stylesheet" type="text/css">
        <link href="painel/assets/plugins/p-scroll/perfect-scrollbar.css" rel="stylesheet"/>
		<link href="painel/assets/plugins/icons/icons.css" rel="stylesheet"/>
		<link id="theme" rel="stylesheet" type="text/css" media="all" href="assets/colors/color1.css" />
    </head>
    <body class="login-img">

		<div class="page h-100">

			<div class="">

			<div class="container-login100" style="height: auto;">
				<div class="wrap-login100 p-6">
					<div class="login100-form validate-form" style="text-align: center;">

						<img src="painel/assets/images/logo.png" style="width: 150px;margin-bottom: 30px; box-shadow: 0 0 10px 0px rgb(0 133 183), 0 4px 8px rgb(1 140 193); border-radius: 50%;">

						<p style="margin-bottom: 0px;font-size: 25px;font-weight: 600;">Vidrama</p>
						<p style="position: relative;top: -8px;">Sistema de Gerenciamento</p>

						<div class="wrap-input100 validate-input">
							<input class="input100 login" type="text" name="login" placeholder="Usuário">
							<span class="symbol-input100"><i class="zmdi zmdi-email" aria-hidden="true"></i></span>
						</div>

						<div class="wrap-input100 validate-input" style="margin-bottom: 20px;">
							<input class="input100 senha" type="password" name="pass" placeholder="Senha">
							<span class="symbol-input100"><i class="zmdi zmdi-lock" aria-hidden="true"></i></span>
						</div>

						<div class="text-right pt-1" style="margin-bottom: 20px;">
							<p class="mb-0"><a href="#" class="text-primary ml-1">Esqueceu a senha?</a></p>
						</div>

						<div class="container-login100-form-btn">
							<button class="login100-form-btn btn-primary" onclick="entrar()">Entrar</button>
						</div>
					
					</div>
				</div>
			</div>

		</div>


		</div>
		 

		<script src="painel/assets/plugins/jquery/jquery.min.js"></script>
		<script src="painel/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="painel/assets/plugins/bootstrap/js/popper.min.js"></script>
		<script src="painel/assets/js/sweetalert.all.min.js"></script>
		<script src="painel/assets/js/login.js?v=3"></script>


    </body>
</html>
